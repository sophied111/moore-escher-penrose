# PixelDiT-1300M conformal Droste preset -- the paper's re-matched schedule for
# this backbone. Same T-cycle mechanism as flux_conformal (mode=alt warm-up +
# T/T-dagger window + post-loop time travel); the sigma bounds are stage-matched
# to PixelDiT (it is further along than FLUX at equal sigma). Reference cell:
# pixdit_s4b aquarium_tunnel__conformal__pixdit__s4w2_tt75__sd7 on the v2 engine
# (laplacian_droste.py --model pixeldit, exp/pixdit_scout), FlowMatchEuler shift=4.
backbone: pixeldit
model_id: nvidia/PixelDiT-1300M-1024px
num_steps: 128
cfg_scale: 3.5          # reference --cfg_scale 3.5 (two-branch CFG on velocity)

family: conformal
inset_scale: 0.25
periods: 2              # reference --tc_periods_sched 0,2 (warm-up p=0, window p=2)
zoom: 0.4973785400390625  # reference --tc_zoom 1.3 clamped by effective_zoom @4096
                          # window raster (same value as flux_conformal); warm-up
                          # uses WARMUP_CONF_ZOOM (0.49701416 @1024) in base.py
supersample: 1          # reference --tc_sup 1

# Stage-matched sigma window (PixelDiT is further along than FLUX at equal sigma).
sigma_hi: 0.92
sigma_lo: 0.69
warmup_sigma: 0.96

n_ops: 3
op_gap: 9

upres: sr              # reference --tc_upres sr (window ops only; warm-up off)

# Post-loop time travel: 1 re-denoise pass, re-noised to sigma=0.82 (stage-mapped
# from the FLUX tt 0.75 cell; the run tag says tt75 but the flag is --tt_sigma 0.82).
time_travel: [1, 0.82]

size: 1024   # output images are square (size x size)
